# The defaults of `@mod/users`'s section, generated by `references` from its schema: do not edit; run `pnpm --filter @mod/references run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
users {
	# The users the settings register, each with its identifier and password hash.
	registered = []
	# How failed password checks of one identifier make its next checks wait, in this process.
	waits {
		# Failed checks of one identifier, until they are forgotten, before its checks wait.
		after = 3
		# The first wait; each further failure doubles it.
		first = 1s
		# The longest wait.
		longest = 30s
		# How long an identifier goes with no failure before its failures are forgotten.
		forget = 15m
	}
}
