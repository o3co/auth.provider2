# The defaults of `@mod/core-wire`'s section, generated by `references` from its schema: do not edit; run `pnpm --filter @mod/references run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
core-wire {
	# The path of a PEM file holding the Core entrance's certificate and its chain, read at boot.
	# certificate-file: required
	# The path of a PEM file holding the certificate's private key, read at boot.
	# key-file: required
	# The path of a PEM file holding the authorities a Front instance's certificate must chain to.
	# front-authority-file: required
	# The address the probe listener listens on, serving the probe routes alone.
	probe-host = "127.0.0.1"
	# The probe listener's port; 0 takes a free one.
	probe-port = 8081
	# What a frame no honest Front sends does beyond its warning: `notify`, nothing more; `cut`, the Front instance that sent it is refused until the Core restarts.
	on-violation = "notify"
}
