# The defaults of `@mod/front-relay`'s section, generated by `references` from its schema: do not edit; run `pnpm --filter @mod/references run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
front-relay {
	# The Core's entrance: its address or name.
	# core-host: required
	# The port of the Core's entrance.
	# core-port: required
	# The name the Core's certificate is checked for; core-host when not set.
	# server-name: optional
	# The path of a PEM file holding this Front instance's certificate and its chain, read at each connection.
	# certificate-file: required
	# The path of a PEM file holding the certificate's private key, read at each connection.
	# key-file: required
	# The path of a PEM file holding the authorities the Core's certificate must chain to.
	# core-authority-file: required
	# How long a request waits for the Core's reply, from 100ms to 1m, such as 10s.
	timeout = 10s
}
