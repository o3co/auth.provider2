# The defaults of `@mod/authorize`'s section, generated by `references` from its schema: do not edit; run `pnpm --filter @mod/references run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
authorize {
	# The static login screen's URL, where an RP sends the browser with its JAR: published as the authorization endpoint. https only.
	# screen-url: required
	# The longest a JAR may still live when it starts a login, from `30s` to `1h` in whole seconds.
	jar-max-lifetime = 10m
	# Starts allowed per source in each window.
	requests = 30
	# The window starts are counted over, from 1s to 1d.
	window = 1m
	# How long a JAR's reservation is kept past its expiry, from `1s` to `5m` in whole seconds: more than replicas' clocks may differ, as a JAR is taken only before its expiry.
	clock-skew = 30s
}
