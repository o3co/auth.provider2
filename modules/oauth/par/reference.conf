# The defaults of `@mod/par`'s section, generated by `references` from its schema: do not edit; run `pnpm --filter @mod/references run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
par {
	# Whether a login's request is taken pushed alone (FAPI 2.0), never by value: `false` takes a JAR by value too, outside a FAPI configuration.
	pushed-only = true
	# The longest a pushed JAR may still live, from `10s` to `10m` in whole seconds.
	jar-max-lifetime = 90s
	# Pushed requests allowed per source in each window.
	requests = 60
	# The window pushed requests are counted over, from 1s to 1d.
	window = 1m
	# How long a pushed request is kept past its JAR's expiry, from `1s` to `5m` in whole seconds.
	clock-skew = 30s
}
