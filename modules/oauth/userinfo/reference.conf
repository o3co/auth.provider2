# The defaults of `@mod/userinfo`'s section, generated by `references` from its schema: do not edit; run `pnpm --filter @mod/references run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
userinfo {
	# Requests allowed per source in each window, whatever their scheme, counted before the token is read.
	requests = 60
	# The window `requests` is counted over, from `1s` to `1d` in whole seconds.
	window = 1m
}
