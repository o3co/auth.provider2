# The defaults of `@mod/client-credentials`'s section, generated by `references` from its schema: do not edit; run `pnpm --filter @mod/references run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
client-credentials {
	# How long a client's own token lives, from 1m to the 15m authority-rules lets one live; written with its unit.
	lifetime = 5m
	# The requests a client may make in a minute, counted once it is authenticated.
	requests = 60
	# The clients issued nothing, by id, until removed here; it only narrows.
	suspended = []
}
