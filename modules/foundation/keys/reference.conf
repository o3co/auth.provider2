# The defaults of `@mod/keys`'s section, generated by `references` from its schema: do not edit; run `pnpm --filter @mod/references run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
keys {
	# authority: The authority's ring: its public keys are the JWKS.
	# authority.signing: The key the authority signs with now.
	# The key id tokens signed with this key carry, unique in the section.
	# authority.signing.kid: required
	# The algorithm the authority signs with.
	# authority.signing.alg: required
	# authority.next: The key that signs next: published and verifying now, never signing, so verifiers hold it before it signs.
	# The key id of the key that signs next, unique in the section.
	# authority.next.kid: required when authority.next is set
	# The algorithm the next key will sign with.
	# authority.next.alg: required when authority.next is set
	# Past signing keys that still verify tokens until each one's `expires-at`.
	authority.previous = []
	# core: The Core's ring: its public keys are what the login screen pins.
	# The Core generation this Core runs as: its key in `keys` signs, the others verify.
	# core.generation: required
	# The Core's ring, a key for each Core generation: the screen pins them all, a later one before its generation starts.
	# core.keys: required
	# sealing: The Core's sealing key, which the screen pins beside the Core's ring.
	# The key id of the P-256 key the screen seals its requests to, unique in the section.
	# sealing.kid: required
}
