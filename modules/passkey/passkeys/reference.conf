# The defaults of `@mod/passkeys`'s section, generated by `references` from its schema: do not edit; run `pnpm --filter @mod/references run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
passkeys {
	# Whether an assertion must show the authenticator verified its user, as WebAuthn says it; anything but required breaks the promise that a new login needs the user's passkey.
	user-verification = "required"
	# How long a reserved key may wait for its possession to be shown and committed.
	pending-lifetime = 10m
	# The most passkeys a subject may hold, from 1 to 16: the most a list of keys answers in its one padded length.
	max-credentials = 10
}
