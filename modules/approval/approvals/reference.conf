# The defaults of `@mod/approvals`'s section, generated by `references` from its schema: do not edit; run `pnpm --filter @mod/references run configuration`.
# For reading only: the module applies these itself, and the app does not load this file.
approvals {
	# How long a statement may be used once issued, from `30s` to `1h` in whole seconds.
	statement-lifetime = 5m
	# How many statements one key a caller counts by may be issued in `issue-window`.
	issue-limit = 30
	# How many statements every replica together may issue in `issue-window`.
	issue-total = 100000
	# The window `issue-limit` counts in, from `1s` to a day.
	issue-window = 1m
	# How many statements this process signs at once; more are refused as busy.
	max-concurrent = 64
}
